<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Clash Sub · 订阅管理</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
	<link rel="icon" type="image/png" href="https://github.com/redf1rst/clash-sub/blob/main/img/clash-sub.png?raw=true">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css" />
	<script>
		// 访问控制在服务端路由入口统一完成（认证先于静态资源返回）。
		// 页面能被送到浏览器, 就说明服务端认证已通过, 前端不再做二次 Cookie 判断:
		// 之前基于 JS 可读 cookie (access_token_client) 的前端门禁在手机端会误判
		// (iOS ITP 把脚本可写 Cookie 压到 7 天 / 微信等 WebView Cookie 罐不持久),
		// 导致 HttpOnly 令牌仍在却仍被弹回 /auth。
		(function () {
			// 兼容旧版登录跳转残留的 ?verified=1 参数, 静默清理
			if (new URLSearchParams(window.location.search).get('verified') === '1') {
				var u = new URL(window.location.href);
				u.searchParams.delete('verified');
				window.history.replaceState({}, document.title, u.pathname + u.search);
			}
		})();

		// 令牌失效时 (服务端对 /api/* 返回 401) 统一回验证页, 避免每处 fetch 各写一套处理
		(function () {
			if (typeof window.fetch !== 'function') return;
			var rawFetch = window.fetch.bind(window);
			window.fetch = function (input, init) {
				return rawFetch(input, init).then(function (res) {
					try {
						var rawUrl = typeof input === 'string' ? input : (input && input.url) || '';
						var path = new URL(rawUrl, window.location.origin).pathname;
						if (res.status === 401 && path.indexOf('/api/') === 0) {
							var back = window.location.pathname + window.location.search;
							window.location.href = '/auth?redirect=' + encodeURIComponent(back);
						}
					} catch (e) { /* 忽略解析失败 */ }
					return res;
				});
			};
		})();
	</script>
	<style>
		:root {
			color-scheme: light;
			--canvas: #f5f2e9;
			--paper: #fffdf7;
			--ink: #192d26;
			--pine: #174637;
			--pine-deep: #102f26;
			--muted: #52655b;
			--line: #d6ddd1;
			--control-line: #84968b;
			--accent: #e7bd76;
			--sage: #e8efe5;
			--danger: #8b332d;
			--danger-bg: #faeae5;
			--radius: 12px;
			--font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
			--font-display: 'Fraunces', Georgia, serif;
			--font-mono: ui-monospace, Consolas, monospace;
		}

		*, *::before, *::after { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; background: var(--canvas); color: var(--ink); font: 1rem/1.6 var(--font-body); }
		body:has(dialog[open]) { overflow: hidden; }
		button, input, textarea { font: inherit; }
		button, input, textarea { color: inherit; }
		:focus-visible { outline: 3px solid var(--pine); outline-offset: 3px; }
		[hidden] { display: none !important; }
		h1, h2, h3, p { margin: 0; }

		.container { max-width: 76rem; margin-inline: auto; padding: clamp(1rem, 4vw, 3rem); }
		.header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 2rem;
			padding: clamp(1.5rem, 5vw, 4rem);
			overflow: hidden;
			border-radius: 20px;
			background: var(--pine-deep);
			color: var(--paper);
		}
		.header h1 { font: 700 clamp(2.65rem, 7vw, 5.4rem)/1.02 var(--font-display); letter-spacing: -.04em; }
		.header p { margin-top: .85rem; color: #dde8dd; }
		.brand-mark {
			position: relative;
			flex: 0 0 8rem;
			height: 8rem;
			border: 1px solid #759187;
			border-radius: 50%;
			background: repeating-radial-gradient(circle, transparent 0 13px, #759187 14px 15px, transparent 16px 22px);
		}
		.brand-mark::after { content: ''; position: absolute; inset: 0; margin: auto; width: .75rem; height: .75rem; border-radius: 50%; background: var(--accent); }
		.tabs { display: flex; gap: .25rem; margin-block: 1.25rem; padding: .25rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
		.tab { flex: 1; min-height: 44px; border: 0; border-radius: 8px; background: transparent; font-weight: 700; cursor: pointer; }
		.tab:hover { background: var(--sage); }
		.tab.active { color: var(--paper); background: var(--pine); }
		.section { display: none; }
		.section.active { display: block; }
		.section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
		.section-head h2 { font-size: clamp(1.35rem, 3vw, 1.9rem); line-height: 1.25; }
		.section-head p { margin-top: .35rem; color: var(--muted); }

		.btn, .confirm-btn, .btn-icon, .close {
			display: inline-flex;
			min-height: 44px;
			align-items: center;
			justify-content: center;
			padding: .45rem .85rem;
			border: 1px solid var(--control-line);
			border-radius: 8px;
			background: var(--paper);
			color: var(--pine);
			font-size: .875rem;
			font-weight: 700;
			text-align: center;
			cursor: pointer;
			transition: background-color .18s ease, border-color .18s ease, color .18s ease;
		}
		.btn:hover, .confirm-btn:hover, .btn-icon:hover { background: var(--sage); border-color: var(--pine); }
		.btn.primary { background: var(--pine); border-color: var(--pine); color: var(--paper); }
		.btn.primary:hover { background: var(--pine-deep); }
		.btn.success, .btn.clash-import { background: var(--sage); border-color: var(--control-line); }
		.btn.success:hover, .btn.clash-import:hover { background: #d8e5d8; border-color: var(--pine); }
		.btn.danger, .confirm-btn.danger { color: var(--danger); border-color: #b57d76; }
		.btn.danger:hover, .confirm-btn.danger:hover { background: var(--danger-bg); border-color: var(--danger); }
		.btn:disabled { opacity: .65; background: #ecece3; color: #47574e; border-color: var(--line); cursor: not-allowed; }
		.btn[aria-busy='true']::before { content: ''; display: inline-block; width: .8rem; height: .8rem; margin-right: .45rem; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .75s linear infinite; }
		@keyframes spin { to { transform: rotate(360deg); } }
		.btn-icon { min-width: 44px; padding: .15rem .45rem; }
		.btn.small { padding-inline: .65rem; }

		.import-menu {
			position: fixed;
			z-index: 4000;
			width: min(20rem, calc(100vw - 1.5rem));
			padding: .3rem;
			border: 1px solid var(--control-line);
			border-radius: 10px;
			background: var(--paper);
			box-shadow: 0 16px 38px #102f2629;
		}
		.import-menu[hidden] { display: none; }
		.import-menu-item {
			display: grid;
			gap: .1rem;
			width: 100%;
			min-height: 44px;
			padding: .5rem .7rem;
			border: 0;
			border-radius: 7px;
			background: transparent;
			color: var(--ink);
			font: inherit;
			text-align: start;
			cursor: pointer;
		}
		.import-menu-item:hover, .import-menu-item:focus-visible { background: var(--sage); outline: none; }
		.import-menu-item:focus-visible { box-shadow: inset 0 0 0 2px var(--pine); }
		.import-menu-label { font-size: .875rem; font-weight: 700; color: var(--pine); }
		.import-menu-hint { font-size: .75rem; color: var(--muted); }
		.import-menu-sep { height: 1px; margin: .25rem .45rem; background: var(--line); }

		.list { display: grid; gap: .6rem; margin-top: .75rem; }
		.list-item, .empty-state { padding: clamp(.75rem, 2vw, 1.15rem); border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
		.list-item { display: grid; align-items: center; gap: .65rem; min-width: 0; }
		.list-item:focus-within, .list-item:hover { border-color: var(--control-line); }
		.list-item.selected { background: var(--sage); border-color: var(--pine); }
		.list-item.newly-added { border-inline-start: 4px solid #488164; scroll-margin-block: 1rem; }
		.item-info, .item-name, .item-details { min-width: 0; overflow-wrap: anywhere; }
		.item-name { display: flex; align-items: center; flex-wrap: wrap; gap: .35rem; font-weight: 700; }
		.item-details { margin-top: .2rem; color: var(--muted); font-size: .85rem; }
		.item-details .success { color: var(--pine); font-weight: 700; }
		.item-details .btn-icon { margin-inline: .3rem; }
		.item-link { font-family: var(--font-mono); }
		.item-actions, .item-actions-row-1, .item-actions-row-2, .action-buttons { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem; }
		.empty-state { display: grid; justify-items: center; gap: .45rem; padding-block: clamp(2.5rem, 8vw, 5.5rem); border-style: dashed; text-align: center; color: var(--muted); }
		.empty-state > div { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: 10px; background: var(--sage); color: var(--pine); font-size: 1.3rem; }
		.action-bar { display: grid; gap: .65rem; margin-block: .85rem; }
		.action-message { min-width: 0; }
		.message, .selection-info { padding: .6rem .85rem; border: 1px solid var(--line); border-radius: 8px; background: var(--sage); color: var(--pine-deep); font-size: .875rem; white-space: pre-line; overflow-wrap: anywhere; }
		.message { display: none; margin-bottom: .5rem; }
		.message.error, .output-entry.error { background: var(--danger-bg); color: var(--danger); }
		.message.warning, .output-entry.warning { background: #f6e9cc; color: #69461d; }
		.selection-info { margin-bottom: .5rem; }

		dialog { padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); color: var(--ink); box-shadow: 0 20px 70px #102f2640; }
		dialog::backdrop { background: #102f269c; }
		.modal { width: min(56rem, calc(100% - 1.5rem)); max-width: none; max-height: calc(100% - 1.5rem); overflow: hidden; }
		.modal[open] .modal-content { display: flex; flex-direction: column; max-height: min(90dvh, calc(100dvh - 1.5rem)); }
		.modal-header { display: flex; gap: .75rem; align-items: center; justify-content: space-between; padding: .75rem clamp(.8rem, 3vw, 1.4rem); background: var(--pine-deep); color: var(--paper); }
		.modal-header h3 { overflow-wrap: anywhere; font-size: clamp(1rem, 3vw, 1.3rem); }
		.close { min-width: 44px; padding: 0; border-color: #839a8d; background: transparent; color: inherit; font-size: 1.5rem; }
		.close:hover { background: var(--pine); }
		.close:focus-visible { outline-color: var(--accent); }
		.modal-body { overflow-y: auto; overscroll-behavior: contain; padding: clamp(.8rem, 3vw, 1.4rem); }
		.confirm-modal { width: min(28rem, calc(100% - 1.5rem)); max-width: none; }
		.confirm-modal-header { padding: 1rem 1.25rem; background: var(--danger-bg); color: var(--danger); }
		.confirm-modal-body { padding: 1.25rem; overflow-wrap: anywhere; }
		.confirm-modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }

		.copy-link-single { margin-bottom: 1.1rem; }
		.link-item { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .85rem; padding: .8rem; background: var(--sage); border-radius: 10px; }
		.link-item strong { flex-basis: 100%; font-size: .875rem; }
		.link-url { flex: 1 1 12rem; min-width: 0; color: var(--muted); font: .8rem/1.6 var(--font-mono); overflow-wrap: anywhere; }
		.input-group { margin-block: .85rem; }
		.input-group label, .input-group .field-label { display: block; margin-bottom: .35rem; font-size: .875rem; font-weight: 700; }
		.field-help { margin-top: .25rem; color: var(--muted); font-size: .8rem; }
		.input-group textarea, .edit-name-input { width: 100%; padding: .6rem .75rem; border: 1px solid var(--control-line); border-radius: 8px; background: var(--paper); }
		.input-group textarea { display: block; min-height: 6rem; resize: vertical; }
		.edit-name-input[aria-busy='true'] { opacity: .65; }
		.custom-select { position: relative; }
		.select-display { display: flex; width: 100%; justify-content: space-between; font-size: 1rem; font-weight: 500; }
		.select-arrow { margin-inline-start: .75rem; }
		.select-display.active .select-arrow { transform: rotate(180deg); }
		.select-options { display: none; position: absolute; inset: calc(100% + .25rem) 0 auto; z-index: 2; max-height: 13rem; overflow-y: auto; overscroll-behavior: contain; padding: .25rem; border: 1px solid var(--control-line); border-radius: 10px; background: var(--paper); box-shadow: 0 8px 24px #102f2622; }
		.select-options.show { display: grid; }
		.select-option { display: flex; align-items: center; gap: .5rem; justify-content: flex-start; min-height: 44px; padding: .45rem .55rem; border: 0; border-radius: 5px; background: none; font-size: .875rem; cursor: pointer; }
		.select-option:hover, .select-option[aria-pressed='true'] { background: var(--sage); }
		.select-option:focus-visible { outline-offset: -3px; }

		.output-section { margin-block: .85rem; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
		.output-header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .35rem .75rem; border-bottom: 1px solid var(--line); background: var(--sage); border-radius: 9px 9px 0 0; font-size: .875rem; font-weight: 700; }
		.output-box { min-height: 4.5rem; max-height: 11rem; overflow-y: auto; padding: .5rem .75rem; font: .8rem/1.55 var(--font-mono); }
		.output-placeholder, .output-timestamp, .output-time { color: var(--muted); }
		.output-placeholder { padding-top: .8rem; text-align: center; }
		.output-entry { padding: .25rem .4rem; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
		.output-entry.success { color: var(--pine); }
		.output-timestamp, .output-time { margin-inline-end: .3rem; }
		.subscription-meta { display: flex; flex-wrap: wrap; gap: .25rem .6rem; margin-top: .4rem; font-size: .8rem; color: var(--muted); }
		.traffic-info, .expire-info { padding: .15rem .4rem; border-radius: 6px; background: var(--sage); overflow-wrap: anywhere; }
		.collection-proxy-checkbox, .collection-subscription-checkbox { width: 1.25rem; height: 1.25rem; margin: 0; accent-color: var(--pine); cursor: pointer; }
		.checkbox-wrapper { display: none; }
		#collectionProxyList .list-item, #collectionSubList .list-item { grid-template-columns: 1.25rem minmax(0, 1fr); }
		#collectionProxyList .list-item > .node-delete-btn, #collectionSubList .list-item > .item-actions { grid-column: 2; justify-self: start; }

		@media (min-width: 45rem) {
			.tabs { width: fit-content; }
			.tab { min-width: 9rem; padding-inline: 1.4rem; }
			.list-item { grid-template-columns: minmax(0, 1fr) auto; }
			.item-actions { justify-content: flex-end; }
			#collectionProxyList .list-item, #collectionSubList .list-item { grid-template-columns: 1.25rem minmax(0, 1fr) auto; }
			#collectionProxyList .list-item > .node-delete-btn, #collectionSubList .list-item > .item-actions { grid-column: 3; }
		}
		@media (max-width: 34rem) {
			.header { gap: .75rem; }
			.brand-mark { flex-basis: 2.8rem; height: 2.8rem; background: repeating-radial-gradient(circle, transparent 0 6px, #759187 7px 8px, transparent 9px 11px); }
			.brand-mark::after { width: .45rem; height: .45rem; }
			.item-actions-row-1, .item-actions-row-2 { width: 100%; }
			.item-actions-row-1 .btn, .item-actions-row-2 .btn { flex: 1 1 5rem; padding-inline: .4rem; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
		}
	</style>
</head>

<body>
	<main class="container">
		<header class="header">
			<div>
				<h1>Clash Sub</h1>
				<p>管理代理节点与订阅链接</p>
			</div>
			<div class="brand-mark" aria-hidden="true"></div>
		</header>

		<div class="tabs" role="tablist" aria-label="集合类型">
			<button type="button" class="tab active" id="proxy-tab" role="tab" aria-selected="true"
				aria-controls="proxy-collections" onclick="switchTab('proxy-collections', event)">节点集合</button>
			<button type="button" class="tab" id="sub-tab" role="tab" aria-selected="false" tabindex="-1"
				aria-controls="sub-collections" onclick="switchTab('sub-collections', event)">订阅集合</button>
		</div>

		<div class="content">
			<!-- 节点集合管理部分 -->
			<section id="proxy-collections" class="section active" role="tabpanel"
				aria-labelledby="proxy-tab" tabindex="0">
				<header class="section-head">
					<div>
						<h2>节点集合</h2>
						<p>将代理节点组合成一个 Clash 订阅链接。</p>
					</div>
					<button type="button" class="btn primary" onclick="createProxyCollection(event)">创建新集合</button>
				</header>
				<div id="collectionMessage" class="message" role="status"></div>
				<div class="list" id="collectionList" aria-busy="true">
					<div class="empty-state" role="status"><p>正在加载节点集合…</p></div>
				</div>
			</section>

			<!-- 订阅集合管理部分 -->
			<section id="sub-collections" class="section" role="tabpanel"
				aria-labelledby="sub-tab" tabindex="0" hidden>
				<header class="section-head">
					<div>
						<h2>订阅集合</h2>
						<p>将多个来源整合成一个 Clash 订阅链接。</p>
					</div>
					<button type="button" class="btn primary" onclick="createSubCollection(event)">创建新集合</button>
				</header>
				<div id="subCollectionMessage" class="message" role="status"></div>
				<div class="list" id="subCollectionList" aria-busy="true">
					<div class="empty-state" role="status"><p>正在加载订阅集合…</p></div>
				</div>
			</section>
		</div>
	</main>

	<!-- 节点集合管理弹窗 -->
	<dialog id="proxyCollectionModal" class="modal" aria-labelledby="proxyCollectionModalTitle">
		<div class="modal-content">
			<div class="modal-header">
				<h3 id="proxyCollectionModalTitle">管理节点集合</h3>
				<button type="button" class="close" aria-label="关闭节点管理" onclick="closeProxyCollectionModal()" autofocus>&times;</button>
			</div>
			<div class="modal-body">
				<!-- 复制链接 -->
				<div class="copy-link-single">
					<div class="link-item">
						<strong>集合订阅链接</strong>
						<div class="link-url" id="currentCollectionLink"></div>
						<button class="btn success" onclick="copyCurrentCollectionLink()">复制链接</button>
					</div>
				</div>

				<!-- 添加节点 -->
				<div class="input-group">
					<label for="collectionProxyUrl">添加节点</label>
					<textarea id="collectionProxyUrl" aria-describedby="collectionProxyUrlHelp" placeholder="粘贴节点链接或 JSON 对象"></textarea>
					<p class="field-help" id="collectionProxyUrlHelp">每行输入一个节点，可混合使用链接和单行 JSON 对象。</p>
				</div>

				<div class="input-group">
					<span id="collectionRegionLabel" class="field-label">地区选择</span>
					<div class="custom-select" id="collectionRegionSelect">
						<button type="button" class="btn select-display" aria-labelledby="collectionRegionLabel selectedCollectionRegion"
							aria-expanded="false" aria-controls="collectionRegionOptions" onclick="toggleCollectionRegionDropdown()">
							<span id="selectedCollectionRegion">🌍 自动识别地区</span>
							<span class="select-arrow" aria-hidden="true">▾</span>
						</button>
						<div class="select-options" id="collectionRegionOptions" role="group" aria-labelledby="collectionRegionLabel">
							<button type="button" class="select-option" data-value="auto" aria-pressed="true">🌍 自动识别地区</button>
							<button type="button" class="select-option" data-value="US" aria-pressed="false"><span aria-hidden="true" class="fi fi-us"></span> 美国</button>
							<button type="button" class="select-option" data-value="HK" aria-pressed="false"><span aria-hidden="true" class="fi fi-hk"></span> 香港</button>
							<button type="button" class="select-option" data-value="JP" aria-pressed="false"><span aria-hidden="true" class="fi fi-jp"></span> 日本</button>
							<button type="button" class="select-option" data-value="KR" aria-pressed="false"><span aria-hidden="true" class="fi fi-kr"></span> 韩国</button>
							<button type="button" class="select-option" data-value="SG" aria-pressed="false"><span aria-hidden="true" class="fi fi-sg"></span> 新加坡</button>
							<button type="button" class="select-option" data-value="TW" aria-pressed="false"><span aria-hidden="true" class="fi fi-tw"></span> 台湾</button>
							<button type="button" class="select-option" data-value="GB" aria-pressed="false"><span aria-hidden="true" class="fi fi-gb"></span> 英国</button>
							<button type="button" class="select-option" data-value="DE" aria-pressed="false"><span aria-hidden="true" class="fi fi-de"></span> 德国</button>

	<script>
		let proxyCollections = []; // 节点集合

		// 切换标签页
		function switchTab(tab, event) {
			const getTarget = button => button?.getAttribute('aria-controls');
			const activeTab = getTarget(event?.currentTarget) === tab
				? event.currentTarget
				: Array.from(document.querySelectorAll('.tab')).find(button => getTarget(button) === tab);
			const activePanel = document.getElementById(tab);
			if (!activeTab || !activePanel) return;

			document.querySelectorAll('.tab').forEach(button => {
				const active = button === activeTab;
				button.classList.toggle('active', active);
				button.setAttribute('aria-selected', String(active));
				button.tabIndex = active ? 0 : -1;
			});
			document.querySelectorAll('.section').forEach(panel => {
				const active = panel === activePanel;
				panel.classList.toggle('active', active);
				panel.hidden = !active;
			});
		}

		document.querySelector('.tabs').addEventListener('keydown', function (event) {
			const tabs = Array.from(this.querySelectorAll('.tab'));
			const index = tabs.indexOf(event.target);
			if (index < 0) return;
			let next;
			switch (event.key) {
				case 'ArrowLeft': next = tabs[(index - 1 + tabs.length) % tabs.length]; break;
				case 'ArrowRight': next = tabs[(index + 1) % tabs.length]; break;
				case 'Home': next = tabs[0]; break;
				case 'End': next = tabs[tabs.length - 1]; break;
				default: return;
			}
			event.preventDefault();
			next.click();
			next.focus();
		});

		// 仅用于 HTML 文本节点。动作参数通过监听器传递，不进入 HTML。
		function escapeHtmlText(value) {
			return String(value ?? '').replace(/[&<>]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[char]));
		}

		function setButtonBusy(button, busy, label) {
			if (!button) return;
			button.disabled = busy;
			button.textContent = label;
			button.setAttribute('aria-busy', String(busy));
		}

		// 复制文本到剪贴板
		async function copyToClipboard(text) {
			if (navigator.clipboard) {
				try {
					await navigator.clipboard.writeText(text);
					return true;
				} catch (error) {
					// 浏览器拒绝 Clipboard API 时使用文本选区。
				}
			}
			return fallbackCopyTextToClipboard(text);
		}

		function fallbackCopyTextToClipboard(text) {
			const textArea = document.createElement('textarea');
			textArea.value = text;
			textArea.readOnly = true;
			textArea.style.position = 'fixed';
			textArea.style.opacity = '0';
			const previousFocus = document.activeElement;
			const openDialogs = document.querySelectorAll('dialog[open]');
			(openDialogs[openDialogs.length - 1] || document.body).appendChild(textArea);
			textArea.focus({ preventScroll: true });
			textArea.select();
			try {
				return document.execCommand('copy');
			} catch (error) {
				return false;
			} finally {
				textArea.remove();
				previousFocus?.focus({ preventScroll: true });
			}
		}

		// 显示消息
		function showMessage(elementId, message, type = 'success') {
			const messageEl = document.getElementById(elementId);
			messageEl.textContent = message;
			messageEl.className = 'message ' + type;
			messageEl.style.display = 'block';

			// 根据消息类型和内容设置不同的显示时间
			let displayTime;
			if (type === 'error') {
				displayTime = 8000; // 错误信息显示8秒
			} else if (message.includes('活跃检测完成') && message.includes('移除的订阅')) {
				displayTime = 15000; // 活跃检测结果包含移除信息时显示15秒
			} else if (message.includes('活跃检测完成')) {
				displayTime = 8000; // 活跃检测结果显示8秒
			} else {
				displayTime = 3000; // 其他信息显示3秒
			}

			setTimeout(() => {
				messageEl.style.display = 'none';
			}, displayTime);
		}

		// 加载节点集合列表
		async function loadProxyCollections() {
			const list = document.getElementById('collectionList');
			list.setAttribute('aria-busy', 'true');
			try {
				const response = await fetch('/api/proxy-collections');
				if (!response.ok) throw new Error('HTTP ' + response.status);
				const collections = await response.json();
				if (!Array.isArray(collections)) throw new Error('集合响应格式无效');
				proxyCollections = collections;
				renderProxyCollections();
			} catch (error) {
				console.error('加载节点集合失败:', error);
				showMessage('collectionMessage', '加载节点集合失败，请稍后刷新页面重试', 'error');
				const loading = list.querySelector('.empty-state[role="status"]');
				if (loading) loading.textContent = '加载节点集合失败';
			} finally {
				list.setAttribute('aria-busy', 'false');
			}
		}

		// 渲染节点集合列表
		function renderProxyCollections() {
			const listEl = document.getElementById('collectionList');

			if (proxyCollections.length === 0) {
				listEl.innerHTML = '<div class="empty-state"><div>📁</div><p>暂无节点集合，请创建新集合</p></div>';
				return;
			}

			let html = '';
			for (let i = 0; i < proxyCollections.length; i++) {
				const collection = proxyCollections[i];
				const proxyCount = collection.proxies.length;
				const origin = window.location.origin;
				const collectionUrl = `${origin}/clash/proxies/${collection.id}`;

				html += '<div class="list-item" data-index="' + i + '">';
				html += '<div class="item-info">';
				html += '<div class="item-name">' + escapeHtmlText(collection.name) + '</div>';
				html += '<div class="item-details">节点数量: ' + proxyCount + '</div><div class="item-details item-link">订阅链接: ' + escapeHtmlText(collectionUrl) + '</div>';
				html += '</div>';
				html += '<div class="item-actions">';
				html += '<div class="item-actions-row-1">';
				html += '<button class="btn clash-import" data-action="openImportMenu" data-kind="proxy" aria-haspopup="menu">导入软件</button>';
				html += '<button class="btn" data-action="copyCollectionLink">复制链接</button>';
				html += '</div>';
				html += '<div class="item-actions-row-2">';
				html += '<button class="btn" data-action="manageCollection">管理节点</button>';
				html += '<button class="btn" data-action="renameCollection">重命名</button>';
				html += '<button class="btn danger" data-action="deleteCollection">删除</button>';
				html += '</div>';
				html += '</div>';
				html += '</div>';
			}
			listEl.innerHTML = html;
			const actions = { openImportMenu, copyCollectionLink, manageCollection, renameCollection, deleteCollection };
			listEl.querySelectorAll('[data-action]').forEach(button => {
				const collection = proxyCollections[Number(button.closest('[data-index]').dataset.index)];
				button.addEventListener('click', event => actions[button.dataset.action](collection.id, event, 'proxy'));
			});
		}

		// 创建新的节点集合
		async function createProxyCollection(event) {
			const button = event?.currentTarget;
			if (button?.disabled) return;
			const name = prompt('请输入集合名称（留空使用默认名称）:');
			if (name === null) return; // 用户取消

			setButtonBusy(button, true, '创建中…');
			try {
				const response = await fetch('/api/proxy-collections', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ action: 'create', data: { name } })
				});

				const result = await response.json();

				if (result.error) {
					showMessage('collectionMessage', result.error, 'error');
				} else {
					showMessage('collectionMessage', '节点集合创建成功');
					loadProxyCollections();
				}
			} catch (error) {
				showMessage('collectionMessage', '创建节点集合失败', 'error');
			} finally {
				setButtonBusy(button, false, '创建新集合');
			}
		}

		// 生成Clash URL Scheme链接
		function generateClashScheme(subscriptionUrl) {
			const encodedUrl = encodeURIComponent(subscriptionUrl);
			// 检测是否为移动端，移动端使用clashmeta://，桌面端使用clash://
			const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
			const scheme = isMobile ? 'clashmeta' : 'clash';
			return `${scheme}://install-config?url=${encodedUrl}`;
		}

		// 支持的客户端及导入方案
		const IMPORT_CLIENTS = [
			{ id: 'clash', label: 'Clash / Mihomo', hint: 'Clash Verge · FlClash · mihomo' },
			{ id: 'clashmi', label: 'Clash Mi（iOS）', hint: '与 Stash 冲突时用这个' },
			{ id: 'stash', label: 'Stash', hint: 'iPhone · iPad · Mac' },
			{ id: 'shadowrocket', label: 'Shadowrocket', hint: 'iPhone · iPad' },
			{ id: 'singbox', label: 'sing-box', hint: 'SFI · SFA · SFM' },
			{ id: 'qx', label: 'Quantumult X', hint: '仅支持 ss/vmess/trojan' }
		];

		function base64EncodeUtf8(text) {
			const bytes = new TextEncoder().encode(text);
			let binary = '';
			for (const byte of bytes) binary += String.fromCharCode(byte);
			return btoa(binary);
		}

		function buildSubscriptionUrl(kind, collectionId, target) {
			const path = kind === 'proxy' ? '/clash/proxies/' : '/clash/submerge/';
			const base = `${window.location.origin}${path}${collectionId}`;
			// Clash Mi 与 Clash 共用同一份 mihomo 配置
			return target === 'clash' || target === 'clashmi' ? base : `${base}?target=${encodeURIComponent(target)}`;
		}

		// 部分客户端支持 URL Scheme 直接拉取订阅；失败时用户可改用复制链接
		function buildImportScheme(target, subscriptionUrl, name) {
			const encodedUrl = encodeURIComponent(subscriptionUrl);
			const encodedName = encodeURIComponent(name || '');
			switch (target) {
				case 'clashmi':
					return `clashmi://install-config?url=${encodedUrl}&name=${encodedName}`;
				case 'stash':
					return `stash://install-config?url=${encodedUrl}&name=${encodedName}`;
				case 'shadowrocket':
					return `shadowrocket://add/sub://${base64EncodeUtf8(subscriptionUrl)}?remark=${encodedName}`;
				case 'singbox':
					return `sing-box://import-remote-profile?url=${encodedUrl}&name=${encodedName}`;
				case 'qx': {
					const rulesUrl = `${subscriptionUrl}&part=rules`;
					const payload = JSON.stringify({ server_remote: [`${subscriptionUrl}, tag=${name}`], filter_remote: [rulesUrl] });
					return `quantumult-x:///add-resource?remote-resource=${encodeURIComponent(payload)}`;
				}
				default:
					return `${generateClashScheme(subscriptionUrl)}&name=${encodedName}`;
			}
		}

		let activeImportMenu = null;

		function closeImportMenu() {
			if (!activeImportMenu) return;
			activeImportMenu.menu.remove();
			activeImportMenu = null;
		}

		// 打开“导入软件”客户端菜单
		function openImportMenu(collectionId, event, kind = 'proxy') {
			const anchor = event?.currentTarget;
			const collectionName = (kind === 'sub' ? subCollections : proxyCollections)
				.find(item => item.id === collectionId)?.name || 'clashsub';
			closeImportMenu();

			const menu = document.createElement('div');
			menu.className = 'import-menu';
			menu.setAttribute('role', 'menu');
			menu.setAttribute('aria-label', '选择导入的客户端');

			const items = [];
			const addItem = (labelText, hintText, onSelect) => {
				const button = document.createElement('button');
				button.type = 'button';
				button.className = 'import-menu-item';
				button.setAttribute('role', 'menuitem');
				const label = document.createElement('span');
				label.className = 'import-menu-label';
				label.textContent = labelText;
				const hint = document.createElement('span');
				hint.className = 'import-menu-hint';
				hint.textContent = hintText;
				button.append(label, hint);
				button.addEventListener('click', onSelect);
				menu.appendChild(button);
				items.push(button);
				return button;
			};

			for (const client of IMPORT_CLIENTS) {
				addItem(client.label, client.hint, () => {
					closeImportMenu();
					const url = buildSubscriptionUrl(kind, collectionId, client.id);
					window.location.href = buildImportScheme(client.id, url, collectionName);
				});
			}

			const separator = document.createElement('div');
			separator.className = 'import-menu-sep';
			separator.setAttribute('role', 'separator');
			menu.appendChild(separator);

			addItem('复制 Clash 订阅链接', '手动粘贴到任意客户端', async () => {
				closeImportMenu();
				const copied = await copyToClipboard(buildSubscriptionUrl(kind, collectionId, 'clash'));
				const messageId = kind === 'sub' ? 'subCollectionMessage' : 'collectionMessage';
				showMessage(messageId, copied ? '订阅链接已复制到剪贴板' : '复制失败，请检查浏览器剪贴板权限', copied ? 'success' : 'error');
			});

			document.body.appendChild(menu);

			// 贴住按钮下方，空间不足时向上翻转
			const rect = anchor?.getBoundingClientRect();
			if (rect) {
				const menuRect = menu.getBoundingClientRect();
				const left = Math.min(Math.max(8, rect.left), Math.max(8, window.innerWidth - menuRect.width - 8));
				const flipUp = window.innerHeight - rect.bottom < menuRect.height + 12 && rect.top > menuRect.height + 12;
				const top = flipUp ? rect.top - menuRect.height - 8 : rect.bottom + 8;
				menu.style.left = `${left}px`;
				menu.style.top = `${Math.max(8, top)}px`;
			}

			activeImportMenu = { menu, anchor, items };
			items[0].focus({ preventScroll: true });

			menu.addEventListener('keydown', keyEvent => {
				const index = items.indexOf(document.activeElement);
				if (keyEvent.key === 'Escape') {
					keyEvent.preventDefault();
					keyEvent.stopPropagation();
					closeImportMenu();
					anchor?.focus({ preventScroll: true });
				} else if (keyEvent.key === 'ArrowDown' || keyEvent.key === 'ArrowUp') {
					keyEvent.preventDefault();
					const step = keyEvent.key === 'ArrowDown' ? 1 : -1;
					items[(index + step + items.length) % items.length].focus({ preventScroll: true });
				} else if (keyEvent.key === 'Tab') {
					closeImportMenu();
				}
			});
		}

		document.addEventListener('pointerdown', event => {
			if (!activeImportMenu) return;
			if (activeImportMenu.menu.contains(event.target) || activeImportMenu.anchor?.contains(event.target)) return;
			closeImportMenu();
		});
		document.addEventListener('keydown', event => {
			if (event.key === 'Escape') closeImportMenu();
		});
		window.addEventListener('resize', closeImportMenu);
		window.addEventListener('scroll', closeImportMenu, true);

		// 渲染集合中的节点列表
		function renderCollectionProxies() {
			if (!currentManagingCollection) return;

			const listEl = document.getElementById('collectionProxyList');
			const proxies = currentManagingCollection.proxies;

			if (proxies.length === 0) {
				listEl.innerHTML = '<div class="empty-state"><div>📡</div><p>暂无节点，请添加节点链接</p></div>';
				updateCollectionProxySelectionUI();
				return;
			}

			let html = '';
			let firstNewlyAddedIndex = -1;

			for (let i = 0; i < proxies.length; i++) {
				const proxy = proxies[i];
				const isNewlyAdded = newlyAddedCollectionProxies.has(proxy.name);
				const highlightClass = isNewlyAdded ? ' newly-added' : '';

				// 记录第一个新添加节点的位置
				if (isNewlyAdded && firstNewlyAddedIndex === -1) {
					firstNewlyAddedIndex = i;
				}

				html += '<div class="list-item' + highlightClass + '" data-index="' + i + '">';
				// 桌面端复选框
				html += '<input type="checkbox" aria-label="选择第 ' + (i + 1) + ' 个节点" class="collection-proxy-checkbox desktop-checkbox" data-index="' + i + '" onchange="syncCheckboxState(' + i + ', \'proxy\', event)">';
				// 移动端复选框容器
				html += '<div class="checkbox-wrapper">';
				html += '<input type="checkbox" aria-label="选择第 ' + (i + 1) + ' 个节点" class="collection-proxy-checkbox mobile-checkbox" data-index="' + i + '" onchange="syncCheckboxState(' + i + ', \'proxy\', event)">';
				html += '</div>';
				html += '<div class="item-info">';
				html += '<div class="item-name">';
				html += '<span class="name-text">' + escapeHtmlText(proxy.name) + '</span>';
				html += '<button class="btn-icon" onclick="renameCollectionProxy(' + i + ')" aria-label="重命名节点" title="重命名">✏️</button>';
				html += '</div>';
				html += '<div class="item-details">' + escapeHtmlText(proxy.type) + ' | ';
				html += '<span class="server-text">' + escapeHtmlText(proxy.server) + '</span>';
				html += '<button class="btn-icon" onclick="changeProxyServer(' + i + ')" aria-label="修改服务器地址" title="修改服务器地址">🔧</button>';
				html += ':' + escapeHtmlText(proxy.port) + '</div>';
				html += '</div>';
				// 删除按钮
				html += '<button class="btn danger node-delete-btn" onclick="deleteSingleCollectionProxy(' + i + ')">删除</button>';
				html += '</div>';
			}
			listEl.innerHTML = html;
			updateCollectionProxySelectionUI();

			// 如果有新添加的节点，滚动到第一个新节点
			if (firstNewlyAddedIndex !== -1) {
				setTimeout(() => {
					const listItems = document.querySelectorAll('#collectionProxyList .list-item');
					if (listItems[firstNewlyAddedIndex]) {
						listItems[firstNewlyAddedIndex].scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
					}
				}, 100);
			}

			// 15秒后移除高亮
			if (newlyAddedCollectionProxies.size > 0) {
				setTimeout(() => {
					newlyAddedCollectionProxies.clear();
					// 重新渲染以移除高亮样式
					renderCollectionProxies();
				}, 15000);
			}
		}

		// ========== 集合节点选择功能 ==========

		// 更新集合节点选择UI状态
		function updateCollectionProxySelectionUI() {
			// 同步桌面端和移动端复选框状态
			document.querySelectorAll('#collectionProxyList .list-item').forEach((item, index) => {
				const desktopCheckbox = item.querySelector('.collection-proxy-checkbox:not(.mobile-checkbox)');
				const mobileCheckbox = item.querySelector('.collection-proxy-checkbox.mobile-checkbox');

				if (desktopCheckbox && mobileCheckbox) {
					// 如果其中一个被选中，同步到另一个
					if (desktopCheckbox.checked !== mobileCheckbox.checked) {
						mobileCheckbox.checked = desktopCheckbox.checked;
					}
				}
			});

			const checkboxes = document.querySelectorAll('.collection-proxy-checkbox:not(.mobile-checkbox)');
			const selectedCheckboxes = document.querySelectorAll('.collection-proxy-checkbox:not(.mobile-checkbox):checked');
			const selectedCount = selectedCheckboxes.length;
			const totalCount = checkboxes.length;

			// 更新选择信息显示
			const selectionInfo = document.getElementById('collectionProxySelectionInfo');
			const selectAllBtn = document.getElementById('selectAllCollectionProxiesBtn');
			const copyBtn = document.getElementById('copySelectedCollectionProxiesBtn');
			const deleteBtn = document.getElementById('deleteSelectedCollectionProxiesBtn');

			if (selectedCount > 0) {
				selectionInfo.style.display = 'block';
				selectionInfo.textContent = `已选择 ${selectedCount} / ${totalCount} 个节点`;
				copyBtn.disabled = false;
				deleteBtn.disabled = false;
			} else {
				selectionInfo.style.display = 'none';
				copyBtn.disabled = true;
				deleteBtn.disabled = true;
			}

			// 更新全选按钮文本
			if (selectedCount === totalCount && totalCount > 0) {
				selectAllBtn.textContent = '取消全选';
			} else {
				selectAllBtn.textContent = '全选';
			}

			// 更新列表项的选中样式
			document.querySelectorAll('#collectionProxyList .list-item').forEach((item, index) => {
				const checkbox = item.querySelector('.collection-proxy-checkbox:not(.mobile-checkbox)');
				if (checkbox && checkbox.checked) {
					item.classList.add('selected');
				} else {
					item.classList.remove('selected');
				}
			});
		}

		// 全选/取消全选集合节点
		function selectAllCollectionProxies() {
			const checkboxes = document.querySelectorAll('.collection-proxy-checkbox:not(.mobile-checkbox)');
			const allChecked = Array.from(checkboxes).every(cb => cb.checked);

			// 同时更新桌面端和移动端复选框
			document.querySelectorAll('.collection-proxy-checkbox').forEach(cb => {
				cb.checked = !allChecked;
			});

			updateCollectionProxySelectionUI();

		function getSelectedCollectionProxyIndexes() {
			const selectedCheckboxes = document.querySelectorAll('.collection-proxy-checkbox:not(.mobile-checkbox):checked');

		// 复制选中集合节点的JSON
		async function copySelectedCollectionProxies() {
			const selectedIndexes = getSelectedCollectionProxyIndexes();
			if (selectedIndexes.length === 0) {
				showCollectionMessage('请先选择要复制的节点', 'warning');
				return;
			}

			const selectedProxies = selectedIndexes.map(index => currentManagingCollection.proxies[index]);
			// 修改为单行格式，每个节点一行，取消最外层的[]
			const jsonData = selectedProxies.map(proxy => JSON.stringify(proxy)).join('\n');

			const copied = await copyToClipboard(jsonData);
			showCollectionMessage(copied ? `已复制 ${selectedIndexes.length} 个节点的JSON数据` : '复制失败，请检查浏览器剪贴板权限', copied ? 'success' : 'error');
		}

		// 删除选中的集合节点
		async function deleteSelectedCollectionProxies() {
			const collectionId = currentManagingCollection?.id;
			if (collectionId == null) return;
			const selectedIndexes = getSelectedCollectionProxyIndexes();
			if (selectedIndexes.length === 0) {
				showCollectionMessage('请先选择要删除的节点', 'warning');
				return;
			}

			showConfirmModal(`确定要删除选中的 ${selectedIndexes.length} 个节点吗？`, async function () {
				try {
					const response = await fetch('/api/proxy-collections', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							action: 'batchDeleteProxy',
							collectionId,
							indexes: selectedIndexes
						})
					});

					const result = await response.json();
					if (result.success) {
						showCollectionMessage(`成功删除 ${selectedIndexes.length} 个节点`, 'success');

						// 重新加载集合数据并渲染
						await loadProxyCollections();
						if (currentManagingCollection?.id === collectionId) {
							currentManagingCollection = proxyCollections.find(c => c.id === collectionId) || currentManagingCollection;
							renderCollectionProxies();
						}
					} else {
						showCollectionMessage(result.error || '删除失败', 'error');
					}
				} catch (error) {
					showCollectionMessage('删除节点失败', 'error');
				}
			});
		}

		// 向当前集合添加节点（支持链接和JSON格式自动识别）
		async function addProxyToCurrentCollection() {
			const collectionId = currentManagingCollection?.id;
			if (collectionId == null) return;
			const button = document.getElementById('addCollectionProxyBtn');
			if (button?.disabled) return;
			if (!currentManagingCollection) return;

			const inputContent = document.getElementById('collectionProxyUrl').value.trim();
			if (!inputContent) {
				showCollectionMessage('请输入节点信息', 'error');
				return;
			}

			setButtonBusy(button, true, '添加中…');
			try {
				// 尝试解析输入内容，自动识别格式
				const parsedData = parseCollectionProxyInput(inputContent, selectedCollectionRegionValue);

				const response = await fetch('/api/proxy-collections', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(parsedData)
				});

				const result = await response.json();

				if (result.error) {
					showCollectionMessage(result.error, 'error');
				} else {
					const successCount = result.successCount || result.addedCount || 0;
					let message;
					if (successCount > 0) {
						message = `成功添加 ${successCount} 个节点`;
					} else {
						message = '未能添加节点';
					}

					const skipMessages = [];
					if (result.duplicateCount > 0) {
						skipMessages.push(`${result.duplicateCount} 个重复节点`);
					}
					if (result.errorCount > 0) {
						skipMessages.push(`${result.errorCount} 个格式错误节点`);
					}
					if (skipMessages.length > 0) {
						message += `，跳过 ${skipMessages.join('、')}`;
					}

					showCollectionMessage(message);

					// 清空输入框
					if (currentManagingCollection?.id === collectionId) document.getElementById('collectionProxyUrl').value = '';

					// 清空之前的高亮记录并记录新添加的节点
					newlyAddedCollectionProxies.clear();
					if (result.addedProxies && result.addedProxies.length > 0) {
						result.addedProxies.forEach(proxy => {
							newlyAddedCollectionProxies.add(proxy.name);
						});
					}

					// 重新加载集合数据并渲染
					await loadProxyCollections();
					if (currentManagingCollection?.id === collectionId) {
						currentManagingCollection = proxyCollections.find(c => c.id === collectionId) || currentManagingCollection;
						renderCollectionProxies();
					}

					// 显示添加成功的信息
					if (newlyAddedCollectionProxies.size > 0) {
						addCollectionOutput(`已高亮显示 ${newlyAddedCollectionProxies.size} 个新添加的节点`, 'info');
					}
				}
			} catch (error) {
				showCollectionMessage(error.message || '添加节点失败', 'error');
			} finally {
				setButtonBusy(button, false, '添加节点');
			}
		}

		// 解析集合代理输入内容，自动识别链接和JSON格式
		function parseCollectionProxyInput(inputContent, region) {
			const lines = inputContent.split('\n').map(line => line.trim()).filter(line => line);
			const urlLines = [];
			const jsonObjects = [];

			for (let i = 0; i < lines.length; i++) {
				const line = lines[i];
				const lineNumber = i + 1;

				// 检查是否是代理链接
				if (line.match(/^(vmess|vless|ss|ssr|hysteria|hysteria2|hy2|trojan|tuic|socks5|snell|wg|wireguard|mieru|anytls|ssh|https?):\/\//)) {
					urlLines.push(line);
				}
				// 检查是否是完整的单行JSON对象（支持前缀字符）
				else {
					// 去除行首的制表符、横杠、空格等前缀字符
					const trimmedLine = line.replace(/^[\s\-]*/, '').trim();

					if (trimmedLine.startsWith('{') && trimmedLine.endsWith('}')) {
						try {
							const parsed = JSON.parse(trimmedLine);
							// 不在前端验证JSON字段完整性，交给后端处理
							jsonObjects.push(parsed);
						} catch (e) {
							// JSON解析错误时，将原始字符串作为无效JSON传递给后端
							jsonObjects.push({ _invalid: true, _originalLine: trimmedLine, _error: e.message });
						}
					}
					else {
						throw new Error(`第${lineNumber}行格式无法识别: ${line.substring(0, 50)}${line.length > 50 ? '...' : ''}`);
					}
				}
			}

			// 移除前端JSON字段验证，交给后端处理

			// 如果同时有JSON和链接，使用混合处理
			if (jsonObjects.length > 0 && urlLines.length > 0) {
				return {
					action: 'addMixedProxy',
					collectionId: currentManagingCollection.id,
					data: {
						jsonProxies: jsonObjects,
						proxyUrls: urlLines.join('\n'),
						region
					}
				};
			}
			// 如果只有JSON对象
			else if (jsonObjects.length > 0) {
				return {
					action: 'addJSONProxy',
					collectionId: currentManagingCollection.id,
					proxies: jsonObjects,
					data: { region }
				};
			}
			// 如果只有链接格式
			else if (urlLines.length > 0) {
				return {
					action: 'addProxy',
					data: {
						collectionId: currentManagingCollection.id,
						proxyUrls: urlLines.join('\n'),
						region
					}
				};
			}

			throw new Error('未找到有效的节点信息');
		}



		// 设置集合地区选择器
		function setupCollectionRegionSelector() {
			const selector = document.getElementById('collectionRegionSelect');
			const trigger = selector.querySelector('.select-display');
			const options = Array.from(selector.querySelectorAll('.select-option'));
			options.forEach(option => {
				option.addEventListener('click', () => selectCollectionRegionOption(option.dataset.value, option.textContent));
			});
			selector.addEventListener('keydown', event => {
				if (trigger.getAttribute('aria-expanded') !== 'true') return;
				if (event.key === 'Escape') {
					event.preventDefault();
					setCollectionRegionDropdownOpen(false);
					trigger.focus();
				} else if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
					event.preventDefault();
					const index = options.indexOf(event.target);
					const offset = event.key === 'ArrowDown' ? 1 : -1;
					options[(index + offset + options.length) % options.length]?.focus();
				}
			});
			selector.addEventListener('focusout', event => {
				if (!selector.contains(event.relatedTarget)) setCollectionRegionDropdownOpen(false);
			});
			document.addEventListener('click', event => {
				if (!selector.contains(event.target)) setCollectionRegionDropdownOpen(false);
			});
		}

		// 解析订阅名称，提取基础名称、流量信息和到期时间
		function parseSubscriptionName(fullName) {
			const result = {
				name: fullName,
				traffic: null,
				expire: null,
				used: 0,
				total: 0,
				percentage: 0
			};

			// 提取流量信息 [已用/总量]
			const trafficMatch = fullName.match(/\[([^\]]+)\]/);
			if (trafficMatch) {
				result.traffic = trafficMatch[1];
				// 尝试解析已用/总量
				const parts = trafficMatch[1].split('/');
				if (parts.length === 2) {
					result.used = parseTrafficValue(parts[0].trim());
					result.total = parseTrafficValue(parts[1].trim());
					if (result.total > 0) {
						result.percentage = Math.min(100, (result.used / result.total) * 100);
					}
				}
			}

			// 提取到期时间 (YYYY-MM-DD到期)
			const expireMatch = fullName.match(/\(([^)]+到期)\)/);
			if (expireMatch) {
				result.expire = expireMatch[1];
			}

			// 提取基础名称（移除流量和到期信息）
			result.name = fullName
				.replace(/\s*\[.*?\]/g, '')
				.replace(/\s*\(.*?到期\)/g, '')
				.trim();

			return result;
		}

		function composeSubscriptionName(baseName, metadata) {
			const suffix = [
				metadata.traffic ? `[${metadata.traffic}]` : '',
				metadata.expire ? `(${metadata.expire})` : ''
			].filter(Boolean).join(' ');
			return suffix ? `${baseName} ${suffix}` : baseName;
		}

		// 解析流量值（支持GB、MB等单位）
		function parseTrafficValue(str) {
			const match = str.match(/([\d.]+)\s*([KMGT]?B)/i);
			if (!match) return 0;

			const value = parseFloat(match[1]);
			const unit = match[2].toUpperCase();
			const multipliers = { 'B': 1, 'KB': 1024, 'MB': 1024 * 1024, 'GB': 1024 * 1024 * 1024, 'TB': 1024 * 1024 * 1024 * 1024 };
			return value * (multipliers[unit] || 1);
		}

		// 渲染集合中的订阅列表
		function renderCollectionSubscriptions() {
			if (!currentManagingSubCollection) return;

			const listEl = document.getElementById('collectionSubList');
			const subscriptions = currentManagingSubCollection.subscriptions;
			const subscriptionNames = currentManagingSubCollection.subscriptionNames;

			if (subscriptions.length === 0) {
				listEl.innerHTML = '<div class="empty-state"><div>🔗</div><p>暂无订阅，请添加订阅链接</p></div>';
				updateCollectionSubscriptionSelectionUI();
				return;
			}

			let html = '';
			let firstNewlyAddedIndex = -1;

			for (let i = 0; i < subscriptions.length; i++) {
				const sub = subscriptions[i];
				const fullName = subscriptionNames[i] || ('订阅' + (i + 1));
				const parsed = parseSubscriptionName(fullName);
				const isNewlyAdded = newlyAddedCollectionSubscriptions.has(fullName);
				const highlightClass = isNewlyAdded ? ' newly-added' : '';

				// 记录第一个新添加订阅的位置
				if (isNewlyAdded && firstNewlyAddedIndex === -1) {
					firstNewlyAddedIndex = i;
				}

				html += '<div class="list-item subscription-item' + highlightClass + '" data-index="' + i + '">';
				// 桌面端复选框
				html += '<input type="checkbox" aria-label="选择第 ' + (i + 1) + ' 个订阅" class="collection-subscription-checkbox desktop-checkbox" data-index="' + i + '" onchange="syncCheckboxState(' + i + ', \'subscription\', event)">';
				// 移动端复选框容器
				html += '<div class="checkbox-wrapper">';
				html += '<input type="checkbox" aria-label="选择第 ' + (i + 1) + ' 个订阅" class="collection-subscription-checkbox mobile-checkbox" data-index="' + i + '" onchange="syncCheckboxState(' + i + ', \'subscription\', event)">';
				html += '</div>';
				html += '<div class="item-info">';
				html += '<div class="item-name" id="collectionSubName-' + i + '">';
				html += '<span class="name-text">' + escapeHtmlText(parsed.name) + '</span>';
				html += '</div>';
				html += '<div class="item-details">' + escapeHtmlText(sub) + '</div>';

				// 流量和到期信息区域
				if (parsed.traffic || parsed.expire) {
					html += '<div class="subscription-meta">';

					// 流量信息
					if (parsed.traffic) {
						html += '<div class="traffic-info">';
						html += '<span class="traffic-label">📊 流量:</span>';
						html += '<span class="traffic-value">' + escapeHtmlText(parsed.traffic) + '</span>';
						html += '</div>';
					}

					// 到期时间
					if (parsed.expire) {
						html += '<div class="expire-info">';
						html += '<span class="expire-label">⏰</span>';
						html += '<span class="expire-value">' + escapeHtmlText(parsed.expire) + '</span>';
						html += '</div>';
					}

					html += '</div>';
				}

				html += '</div>';
				html += '<div class="item-actions">';
				html += '<button class="btn" onclick="editCollectionSubscriptionName(' + i + ', event)">编辑名称</button>';
				html += '<button class="btn danger" onclick="deleteSingleCollectionSubscription(' + i + ')">删除</button>';
				html += '</div>';
				html += '</div>';
			}
			listEl.innerHTML = html;
			updateCollectionSubscriptionSelectionUI();

			// 自动滚动到第一个新添加的订阅
			if (firstNewlyAddedIndex !== -1) {
				setTimeout(() => {
					const listItems = listEl.querySelectorAll('.list-item');
					if (listItems[firstNewlyAddedIndex]) {
						listItems[firstNewlyAddedIndex].scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
					}
				}, 100);
			}

			// 15秒后移除高亮效果
			setTimeout(() => {
				newlyAddedCollectionSubscriptions.clear();
				document.querySelectorAll('#collectionSubList .list-item.newly-added').forEach(item => {
					item.classList.remove('newly-added');
				});
			}, 15000);
		}

		// ========== 集合订阅选择功能 ==========

		// 更新集合订阅选择UI状态
		function updateCollectionSubscriptionSelectionUI() {
			// 同步桌面端和移动端复选框状态
			document.querySelectorAll('#collectionSubList .list-item').forEach((item, index) => {
				const desktopCheckbox = item.querySelector('.collection-subscription-checkbox:not(.mobile-checkbox)');
				const mobileCheckbox = item.querySelector('.collection-subscription-checkbox.mobile-checkbox');

				if (desktopCheckbox && mobileCheckbox) {
					// 如果其中一个被选中，同步到另一个
					if (desktopCheckbox.checked !== mobileCheckbox.checked) {
						mobileCheckbox.checked = desktopCheckbox.checked;
					}
				}
			});

			const checkboxes = document.querySelectorAll('.collection-subscription-checkbox:not(.mobile-checkbox)');
			const selectedCheckboxes = document.querySelectorAll('.collection-subscription-checkbox:not(.mobile-checkbox):checked');
			const selectedCount = selectedCheckboxes.length;
			const totalCount = checkboxes.length;

			// 更新选择信息显示
			const selectionInfo = document.getElementById('collectionSubscriptionSelectionInfo');
			const selectAllBtn = document.getElementById('selectAllCollectionSubscriptionsBtn');
			const copyBtn = document.getElementById('copySelectedCollectionSubscriptionsBtn');
			const deleteBtn = document.getElementById('deleteSelectedCollectionSubscriptionsBtn');

			if (selectedCount > 0) {
				selectionInfo.style.display = 'block';
				selectionInfo.textContent = `已选择 ${selectedCount} / ${totalCount} 个订阅`;
				copyBtn.disabled = false;
				deleteBtn.disabled = false;
			} else {
				selectionInfo.style.display = 'none';
				copyBtn.disabled = true;
				deleteBtn.disabled = true;
			}

			// 更新全选按钮文本
			if (selectedCount === totalCount && totalCount > 0) {
				selectAllBtn.textContent = '取消全选';
			} else {
				selectAllBtn.textContent = '全选';
			}

			// 更新列表项的选中样式
			document.querySelectorAll('#collectionSubList .list-item').forEach((item, index) => {
				const checkbox = item.querySelector('.collection-subscription-checkbox:not(.mobile-checkbox)');
				if (checkbox && checkbox.checked) {
					item.classList.add('selected');
				} else {
					item.classList.remove('selected');
				}
			});
		}

		// 全选/取消全选集合订阅
		function selectAllCollectionSubscriptions() {
			const checkboxes = document.querySelectorAll('.collection-subscription-checkbox:not(.mobile-checkbox)');
			const allChecked = Array.from(checkboxes).every(cb => cb.checked);

			// 同时更新桌面端和移动端复选框
			document.querySelectorAll('.collection-subscription-checkbox').forEach(cb => {
				cb.checked = !allChecked;
			});

			updateCollectionSubscriptionSelectionUI();
		}

		// 获取选中的集合订阅索引
		function getSelectedCollectionSubscriptionIndexes() {
			const selectedCheckboxes = document.querySelectorAll('.collection-subscription-checkbox:not(.mobile-checkbox):checked');
			return Array.from(selectedCheckboxes).map(cb => parseInt(cb.dataset.index));
		}

		// 复制选中集合订阅的链接
		async function copySelectedCollectionSubscriptions() {
			const selectedIndexes = getSelectedCollectionSubscriptionIndexes();
			if (selectedIndexes.length === 0) {
				showCollectionSubMessage('请先选择要复制的订阅', 'warning');
				return;
			}

			const selectedUrls = selectedIndexes.map(index => currentManagingSubCollection.subscriptions[index]);
			const urlsText = selectedUrls.join('\n');

			const copied = await copyToClipboard(urlsText);
			showCollectionSubMessage(copied ? `已复制 ${selectedIndexes.length} 个订阅链接` : '复制失败，请检查浏览器剪贴板权限', copied ? 'success' : 'error');
		}

		// 删除选中的集合订阅
		async function deleteSelectedCollectionSubscriptions() {
			const collectionId = currentManagingSubCollection?.id;
			if (collectionId == null) return;
			const selectedIndexes = getSelectedCollectionSubscriptionIndexes();
			if (selectedIndexes.length === 0) {
				showCollectionSubMessage('请先选择要删除的订阅', 'warning');
				return;
			}

			showConfirmModal(`确定要删除选中的 ${selectedIndexes.length} 个订阅吗？`, async function () {
				try {
					const response = await fetch('/api/sub-collections', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							action: 'batchDeleteSubscription',
							collectionId,
							indexes: selectedIndexes
						})
					});

					const result = await response.json();
					if (result.success) {
						showCollectionSubMessage(`成功删除 ${selectedIndexes.length} 个订阅`, 'success');

						// 重新加载集合数据并渲染
						await loadSubCollections();
						if (currentManagingSubCollection?.id === collectionId) {
							currentManagingSubCollection = subCollections.find(c => c.id === collectionId) || currentManagingSubCollection;
							renderCollectionSubscriptions();
						}
					} else {
						showCollectionSubMessage(result.error || '删除失败', 'error');
					}
				} catch (error) {
					showCollectionSubMessage('删除订阅失败', 'error');
				}
			});
		}

		// 复制当前订阅集合链接
		async function copyCurrentSubCollectionLink() {
			if (!currentManagingSubCollection) return;
			const origin = window.location.origin;
			const url = `${origin}/clash/submerge/${currentManagingSubCollection.id}`;
			const copied = await copyToClipboard(url);
			const message = copied ? '订阅链接已复制到剪贴板' : '复制失败，请检查浏览器剪贴板权限';
			const type = copied ? 'success' : 'error';
			showCollectionSubMessage(message, type);
		}

		// 显示订阅集合管理消息
		function showCollectionSubMessage(message, type = 'success') {
			const messageEl = document.getElementById('collectionSubMessage');
			messageEl.textContent = message;
			messageEl.className = 'message ' + type;
			messageEl.style.display = 'block';

			let displayTime;
			if (type === 'error') {
				displayTime = 8000;
			} else if (message.includes('活跃检测完成') && message.includes('移除的订阅')) {
				displayTime = 15000;
			} else if (message.includes('活跃检测完成')) {
				displayTime = 8000;
			} else {
				displayTime = 3000;
			}

			setTimeout(() => {
				messageEl.style.display = 'none';
			}, displayTime);
		}

		// 向当前集合添加订阅
		async function addSubscriptionToCurrentCollection() {
			const collectionId = currentManagingSubCollection?.id;
			if (collectionId == null) return;
			const button = document.getElementById('addCollectionSubBtn');
			if (button?.disabled) return;
			if (!currentManagingSubCollection) return;

			const subscriptionUrls = document.getElementById('collectionSubUrl').value.trim();
			if (!subscriptionUrls) {
				showCollectionSubMessage('请输入订阅链接', 'error');
				return;
			}

			// 计算订阅数量
			const urls = subscriptionUrls.split('\n').map(url => url.trim()).filter(url => url);
			const totalUrls = urls.length;

			// 清空操作日志并显示开始信息
			clearCollectionSubOutput();
			addCollectionSubOutput(`开始添加 ${totalUrls} 个订阅到集合: ${currentManagingSubCollection.name}`);

			setButtonBusy(button, true, '添加中…');
			try {
				const response = await fetch('/api/sub-collections', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						action: 'addSubscription',
						data: {
							collectionId,
							subscriptionUrls: subscriptionUrls
						}
					})
				});

				addCollectionSubOutput('处理完成，分析结果...');
				const result = await response.json();

				if (result.error) {
					addCollectionSubOutput(`添加失败: ${result.error}`, 'error');
					showCollectionSubMessage(result.error, 'error');
				} else {
					let message = `成功添加 ${result.successCount} 个订阅`;

					// 添加成功日志
					addCollectionSubOutput(`✓ 成功添加: ${result.successCount} 个订阅`, 'success');

					if (result.duplicateCount > 0) {
						message += `，跳过 ${result.duplicateCount} 个重复订阅`;
						addCollectionSubOutput(`⚠ 重复跳过: ${result.duplicateCount} 个订阅`, 'warning');
					}
					if (result.failedCount > 0) {
						message += `，${result.failedCount} 个订阅添加失败`;
						addCollectionSubOutput(`✗ 添加失败: ${result.failedCount} 个订阅`, 'error');

						// 显示失败订阅的详细信息
						if (result.failedSubscriptions && result.failedSubscriptions.length > 0) {
							result.failedSubscriptions.forEach((failed, index) => {
								addCollectionSubOutput(`  ${index + 1}. ${failed.error}`, 'error');
								addCollectionSubOutput(`     URL: ${failed.url}`, 'error');
							});
						}
					}

					showCollectionSubMessage(message, result.failedCount > 0 ? 'info' : 'success');

					// 清空输入框
					if (currentManagingSubCollection?.id === collectionId) document.getElementById('collectionSubUrl').value = '';

					// 标记新添加的订阅用于高亮显示
					if (result.addedSubscriptions && result.addedSubscriptions.length > 0) {
						result.addedSubscriptions.forEach(sub => {
							newlyAddedCollectionSubscriptions.add(sub.name);
						});
					}

					// 重新加载集合数据并渲染
					await loadSubCollections();
					if (currentManagingSubCollection?.id === collectionId) {
						currentManagingSubCollection = subCollections.find(c => c.id === collectionId) || currentManagingSubCollection;
						renderCollectionSubscriptions();
					}
				}
			} catch (error) {
				addCollectionSubOutput(`添加订阅失败: ${error.message}`, 'error');
				showCollectionSubMessage('添加订阅失败: ' + error.message, 'error');
			} finally {
				setButtonBusy(button, false, '添加订阅');
			}
		}

		// 编辑集合中订阅的名称
		function editCollectionSubscriptionName(index, event) {
			if (!currentManagingSubCollection) return;

			const nameElement = document.getElementById('collectionSubName-' + index);
			if (nameElement.querySelector('input')) return;
			const trigger = event?.currentTarget;
			const currentFullName = currentManagingSubCollection.subscriptionNames[index] || ('订阅' + (index + 1));
			const currentParsedName = parseSubscriptionName(currentFullName);
			const currentName = currentParsedName.name;

			// 创建输入框
			const input = document.createElement('input');
			input.type = 'text';
			input.value = currentName;
			input.className = 'edit-name-input';
			input.setAttribute('aria-label', '订阅名称');
			const originalContent = Array.from(nameElement.childNodes);
			const collection = currentManagingSubCollection;
			let settled = false;

			nameElement.replaceChildren(input);
			input.focus();
			input.select();

			// 处理保存
			async function saveName(restoreFocus = false) {
				if (settled) return;
				settled = true;
				if (currentManagingSubCollection !== collection) return;
				const finish = () => { if (restoreFocus === true) trigger?.focus(); };
				const newName = input.value.trim();
				if (newName === '' || newName === currentName) {
					// 取消编辑，恢复原始内容
					nameElement.replaceChildren(...originalContent);
					finish();
					return;
				}

				const updatedFullName = composeSubscriptionName(newName, currentParsedName);
				input.readOnly = true;
				input.setAttribute('aria-busy', 'true');
				try {
					const response = await fetch('/api/sub-collections', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							action: 'updateSubscriptionName',
							data: {
								collectionId: collection.id,
								index,
								newName: updatedFullName
							}
						})
					});

					const result = await response.json();

					if (result.error) {
						showCollectionSubMessage(result.error, 'error');
						nameElement.replaceChildren(...originalContent);
					} else {
						showCollectionSubMessage('订阅名称更新成功');
						// 更新本地数据
						collection.subscriptionNames[index] = updatedFullName;
						nameElement.replaceChildren(...originalContent);
						nameElement.querySelector('.name-text').textContent = newName;
					}
				} catch (error) {
					showCollectionSubMessage('更新订阅名称失败', 'error');
					nameElement.replaceChildren(...originalContent);
				} finally {
					finish();
				}
			}

			// 处理取消
			function cancelEdit() {
				if (settled) return;
				settled = true;
				nameElement.replaceChildren(...originalContent);
				trigger?.focus();
			}

			// 绑定事件
			input.addEventListener('blur', saveName);
			input.addEventListener('keydown', function (e) {
				if (e.key === 'Enter') {
					e.preventDefault();
					saveName(true);
				} else if (e.key === 'Escape') {
					e.preventDefault();
					cancelEdit();
				}
			});
		}

		// 当前集合的活跃检测
		async function activeDetectionForCurrentCollection() {
			const collectionId = currentManagingSubCollection?.id;
			if (collectionId == null) return;
			if (!currentManagingSubCollection) return;

			const subscriptions = currentManagingSubCollection.subscriptions;
			if (subscriptions.length === 0) {
				showCollectionSubMessage('没有订阅可以检测', 'error');
				return;
			}

			const btn = document.getElementById('currentCollectionActiveDetectionBtn');

			// 禁用按钮并清空操作日志
			if (btn.disabled) return;
			setButtonBusy(btn, true, '检测中…');
			document.getElementById('collectionSubMessage').style.display = 'none';
			clearCollectionSubOutput();
			addCollectionSubOutput(`开始活跃检测集合: ${currentManagingSubCollection.name}，共 ${subscriptions.length} 个订阅`);

			try {
				// 准备检测数据
				const results = subscriptions.map((url, index) => ({
					url: url,
					name: currentManagingSubCollection.subscriptionNames[index] || `订阅${index + 1}`,
					index: index
				}));

				// 发送批量检测请求
				const response = await fetch('/api/sub-collections', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						action: 'activeDetection',
						data: {
							collectionId,
							results: results
						}
					})
				});

				addCollectionSubOutput('检测完成，正在处理结果...');
				const result = await response.json();

				if (result.error) {
					addCollectionSubOutput(`检测失败: ${result.error}`, 'error');
					showCollectionSubMessage(result.error, 'error');
				} else {
					// 处理检测结果
					const removedSubscriptions = result.removedSubscriptions || [];
					const totalChecked = result.totalChecked || 0;
					const totalRemoved = removedSubscriptions.length;

					let message = `活跃检测完成！检测了 ${totalChecked} 个订阅`;

					// 添加检测完成日志
					addCollectionSubOutput(`✓ 检测完成: ${totalChecked} 个订阅`, 'success');

					if (totalRemoved > 0) {
						message += `，移除了 ${totalRemoved} 个无效订阅`;
						addCollectionSubOutput(`✗ 移除无效: ${totalRemoved} 个订阅`, 'error');

						// 显示移除的订阅详情
						const removedDetails = removedSubscriptions.map(sub =>
							`• ${sub.name}: ${sub.reason}`
						).join('\n');

						message += `\n\n移除的订阅:\n${removedDetails}`;

						// 添加移除详情到日志
						removedSubscriptions.forEach((sub, index) => {
							addCollectionSubOutput(`  ${index + 1}. ${sub.name}`, 'error');
							addCollectionSubOutput(`     原因: ${sub.reason}`, 'error');
						});
					} else {
						message += '，所有订阅都是有效的';
						addCollectionSubOutput('✓ 所有订阅都有效', 'success');
					}

					showCollectionSubMessage(message, totalRemoved > 0 ? 'info' : 'success');

					// 重新加载集合数据并渲染
					await loadSubCollections();
					if (currentManagingSubCollection?.id === collectionId) {
						currentManagingSubCollection = subCollections.find(c => c.id === collectionId) || currentManagingSubCollection;
						renderCollectionSubscriptions();
					}
				}
			} catch (error) {
				addCollectionSubOutput(`活跃检测失败: ${error.message}`, 'error');
				showCollectionSubMessage('活跃检测失败: ' + error.message, 'error');
			} finally {
				// 恢复按钮状态
				setButtonBusy(btn, false, '活跃检测');
			}
		}

		// 复制链接
		function copyLink(elementId) {
			const linkElement = document.getElementById(elementId);
			const originalText = linkElement.textContent;
			copyToClipboard(originalText).then(copied => {
				if (!copied) return;
				linkElement.textContent = '已复制';
				setTimeout(() => {
					linkElement.textContent = originalText;
				}, 1000);
			});
		}

		// 显示集合操作输出
		function showCollectionOperationOutput(message, append = false) {
			const outputContainer = document.getElementById('collectionOperationOutput');
			const outputContent = document.getElementById('collectionOutputContent');

			if (!outputContainer || !outputContent) {
				console.error('集合操作输出框元素未找到');
				return;
			}

			outputContainer.style.display = 'block';

			if (append) {
				outputContent.textContent += '\n' + message;
			} else {
				outputContent.textContent = message;
			}

			// 滚动到底部
			outputContent.scrollTop = outputContent.scrollHeight;
		}

		// 清空集合操作输出
		function clearCollectionOperationOutput() {
			const outputContainer = document.getElementById('collectionOperationOutput');
			const outputContent = document.getElementById('collectionOutputContent');

			if (outputContainer) {
				outputContainer.style.display = 'none';
			}
			if (outputContent) {
				outputContent.textContent = '';
			}
		}

		// 添加订阅集合输出日志
		function addCollectionSubOutput(message, type = 'info') {
			const outputBox = document.getElementById('collectionSubOutputBox');
			const placeholder = outputBox.querySelector('.output-placeholder');

			if (placeholder) {
				placeholder.remove();
			}

			const timestamp = new Date().toLocaleTimeString();
			const entry = document.createElement('div');
			entry.className = `output-entry ${type}`;
			const time = document.createElement('span');
			time.className = 'output-time';
			time.textContent = '[' + timestamp + ']';
			const content = document.createElement('span');
			content.className = 'output-message';
			content.textContent = message;
			entry.append(time, content);

			outputBox.appendChild(entry);
			outputBox.scrollTop = outputBox.scrollHeight;
		}

		// 清空订阅集合输出日志
		function clearCollectionSubOutput() {
			const outputBox = document.getElementById('collectionSubOutputBox');
			outputBox.innerHTML = '<div class="output-placeholder">暂无操作记录</div>';
		}

		// ========== 确认删除弹窗功能 ==========

		let confirmCallback = null;
		const confirmDialog = document.getElementById('confirmModal');

		function showConfirmModal(message, callback) {
			document.getElementById('confirmMessage').textContent = message;
			confirmCallback = callback;
			confirmDialog.showModal();
		}

		function hideConfirmModal() {
			confirmCallback = null;
			confirmDialog.close();
		}

		function confirmDelete() {
			const callback = confirmCallback;
			hideConfirmModal();
			if (callback) callback();
		}

		// 使用原生 modal 的焦点限制和恢复，另行清理关闭后的状态。
		for (const [dialog, close] of [
			[confirmDialog, hideConfirmModal],
			[document.getElementById('proxyCollectionModal'), closeProxyCollectionModal],
			[document.getElementById('subCollectionModal'), closeSubCollectionModal]
		]) {
			dialog.addEventListener('click', event => {
				if (event.target === dialog) close();
			});
			dialog.addEventListener('cancel', event => {
				event.preventDefault();
				close();
			});
		}

		// 同步桌面端和移动端复选框状态
		function syncCheckboxState(index, type, event) {
			let desktopCheckbox, mobileCheckbox;

			if (type === 'proxy') {
				desktopCheckbox = document.querySelector(`#collectionProxyList .list-item[data-index="${index}"] .desktop-checkbox`);
				mobileCheckbox = document.querySelector(`#collectionProxyList .list-item[data-index="${index}"] .mobile-checkbox`);
			} else if (type === 'subscription') {
				desktopCheckbox = document.querySelector(`#collectionSubList .list-item[data-index="${index}"] .desktop-checkbox`);
				mobileCheckbox = document.querySelector(`#collectionSubList .list-item[data-index="${index}"] .mobile-checkbox`);
			}

			if (desktopCheckbox && mobileCheckbox) {
				// 同步两个复选框的状态
				if ((event?.currentTarget || desktopCheckbox) === desktopCheckbox) {
					mobileCheckbox.checked = desktopCheckbox.checked;
				} else {
					desktopCheckbox.checked = mobileCheckbox.checked;
				}
			}

			// 更新UI
			if (type === 'proxy') {
				updateCollectionProxySelectionUI();
			} else if (type === 'subscription') {
				updateCollectionSubscriptionSelectionUI();
			}
		}

		// 删除单个集合节点
		async function deleteSingleCollectionProxy(index) {
			const collectionId = currentManagingCollection?.id;
			if (collectionId == null) return;
			if (!currentManagingCollection) return;

			const proxy = currentManagingCollection.proxies[index];
			if (!proxy) return;

			showConfirmModal(`确定要删除节点 "${proxy.name}" 吗？`, async function () {
				try {
					const response = await fetch('/api/proxy-collections', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							action: 'deleteProxy',
							data: {
								collectionId,
								index: index
							}
						})
					});

					const result = await response.json();
					if (result.success) {
						showCollectionMessage(`已删除节点: ${proxy.name}`, 'success');
						addCollectionOutput(`✗ 删除节点: ${proxy.name}`, 'warning');

						// 重新加载集合数据并渲染
						await loadProxyCollections();
						if (currentManagingCollection?.id === collectionId) {
							currentManagingCollection = proxyCollections.find(c => c.id === collectionId) || currentManagingCollection;
							renderCollectionProxies();
						}
					} else {
						showCollectionMessage(result.error || '删除失败', 'error');
					}
				} catch (error) {
					showCollectionMessage('删除节点失败', 'error');
				}
			});
		}

		// 重命名集合节点
		async function renameCollectionProxy(index) {
			const collectionId = currentManagingCollection?.id;
			if (collectionId == null) return;
			if (!currentManagingCollection) return;

			const proxy = currentManagingCollection.proxies[index];
			if (!proxy) return;

			const newName = prompt('请输入新的节点名称:', proxy.name);
			if (!newName || newName === proxy.name) return;

			try {
				const response = await fetch('/api/proxy-collections', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						action: 'updateProxyName',
						data: {
							collectionId,
							index: index,
							newName: newName
						}
					})
				});

				const result = await response.json();
				if (result.success) {
					showCollectionMessage(`节点已重命名: ${proxy.name} → ${newName}`, 'success');
					addCollectionOutput(`✓ 重命名节点: ${proxy.name} → ${newName}`, 'success');

					// 重新加载集合数据并渲染
					await loadProxyCollections();
					if (currentManagingCollection?.id === collectionId) {
						currentManagingCollection = proxyCollections.find(c => c.id === collectionId) || currentManagingCollection;
						renderCollectionProxies();
					}
				} else {
					showCollectionMessage(result.error || '重命名失败', 'error');
				}
			} catch (error) {
				showCollectionMessage('重命名节点失败', 'error');
			}
		}

		// 修改集合节点IP
		async function changeProxyServer(index) {
			const collectionId = currentManagingCollection?.id;

			if (!currentManagingCollection) return;

			const proxy = currentManagingCollection.proxies[index];

			const newServer = prompt('请输入新的服务器地址 (IP或域名):', proxy.server);
			if (!newServer || newServer === proxy.server) return;

			try {
				const response = await fetch('/api/proxy-collections', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						action: 'updateProxyServer',
						data: {
							collectionId,
							index: index,
							newServer: newServer
						}
					})
				});

				const result = await response.json();
				if (result.success) {
					showCollectionMessage(`节点服务器已更新: ${proxy.server} → ${newServer}`, 'success');
					addCollectionOutput(`✓ 更新服务器: ${proxy.name} (${proxy.server} → ${newServer})`, 'success');

					// 重新加载集合数据并渲染
					await loadProxyCollections();
					if (currentManagingCollection?.id === collectionId) {
						currentManagingCollection = proxyCollections.find(c => c.id === collectionId) || currentManagingCollection;
						renderCollectionProxies();
					}
				} else {
					showCollectionMessage(result.error || '更新服务器失败', 'error');
				}
			} catch (error) {
				showCollectionMessage('更新服务器失败', 'error');
			}
		}

		async function deleteSingleCollectionSubscription(index) {
